                - type: entity
                  entity: input_number.hvac_downstairs_test_zone_2_temp
                  name: Z2 Dining Temp
                - type: entity
                  entity: input_number.hvac_downstairs_test_zone_3_temp
                  name: Z3 Living Temp
                - type: entity
