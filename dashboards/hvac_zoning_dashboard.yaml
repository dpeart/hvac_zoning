title: "HVAC Zoning"
views:
  # ================= UPSTAIRS =================
  - title: Upstairs
    icon: mdi:stairs
    cards:
      # ---------- ALWAYS ON ----------
      - type: horizontal-stack
        cards:
          - type: thermostat
            entity: climate.upstairs_nativezone
          - type: entity
            entity: input_boolean.hvac_zoning_enabled
            name: Zoning
            icon: mdi:power
          - type: entity
            entity: input_boolean.hvac_test_mode
            name: Test Mode
            icon: mdi:test-tube

      # ---------- ZONE MATH (always visible; test-aware sensors) ----------
      - type: grid
        columns: 3
        square: false
        cards:
          - type: entities
            title: "Stairs"
            show_header_toggle: false
            entities:
              - sensor.upstairs_zone_1_temp
              - sensor.upstairs_zone_1_error
              - sensor.upstairs_zone_1_demand
              - sensor.upstairs_zone_1_raw_registers
          - type: entities
            title: "Bed 1"
            show_header_toggle: false
            entities:
              - sensor.upstairs_zone_2_temp
              - sensor.upstairs_zone_2_error
              - sensor.upstairs_zone_2_demand
              - sensor.upstairs_zone_2_raw_registers
          - type: entities
            title: "Bed 2"
            show_header_toggle: false
            entities:
              - sensor.upstairs_zone_3_temp
              - sensor.upstairs_zone_3_error
              - sensor.upstairs_zone_3_demand
              - sensor.upstairs_zone_3_raw_registers
          - type: entities
            title: "Bed 3"
            show_header_toggle: false
            entities:
              - sensor.upstairs_zone_4_temp
              - sensor.upstairs_zone_4_error
              - sensor.upstairs_zone_4_demand
              - sensor.upstairs_zone_4_raw_registers
          - type: entities
            title: "Master Bed"
            show_header_toggle: false
            entities:
              - sensor.upstairs_zone_5_temp
              - sensor.upstairs_zone_5_error
              - sensor.upstairs_zone_5_demand
              - sensor.upstairs_zone_5_raw_registers
          - type: entities
            title: "Master Bath"
            show_header_toggle: false
            entities:
              - sensor.upstairs_zone_6_temp
              - sensor.upstairs_zone_6_error
              - sensor.upstairs_zone_6_demand
              - sensor.upstairs_zone_6_raw_registers

      # ---------- PRODUCTION ONLY: history ----------
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.hvac_test_mode
            state_not: "on"
        card:
          type: history-graph
          title: Demand (last hour)
          hours_to_show: 1
          entities:
            - sensor.upstairs_total_demand
            - sensor.upstairs_zone_1_raw_registers
            - sensor.upstairs_zone_2_raw_registers
            - sensor.upstairs_zone_3_raw_registers
            - sensor.upstairs_zone_4_raw_registers
            - sensor.upstairs_zone_5_raw_registers
            - sensor.upstairs_zone_6_raw_registers

      # ---------- PRODUCTION ONLY: zone sensor wiring ----------
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.hvac_test_mode
            state_not: "on"
        card:
          type: entities
          title: Zone Temperature Sensors
          show_header_toggle: false
          entities:
            - entity: input_text.upstairs_hvac_zone_1_temp_entity
              name: Z1 Stairs
            - entity: input_text.upstairs_hvac_zone_2_temp_entity
              name: Z2 Bed 1
            - entity: input_text.upstairs_hvac_zone_3_temp_entity
              name: Z3 Bed 2
            - entity: input_text.upstairs_hvac_zone_4_temp_entity
              name: Z4 Bed 3
            - entity: input_text.upstairs_hvac_zone_5_temp_entity
              name: Z5 Master Bed
            - entity: input_text.upstairs_hvac_zone_6_temp_entity
              name: Z6 Master Bath

      # ---------- TEST ONLY: bench inputs ----------
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.hvac_test_mode
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: horizontal-stack
              cards:
                - type: entity
                  entity: input_select.hvac_test_action
                  name: Test Action
                - type: entity
                  entity: input_number.hvac_test_target_temp
                  name: Test Target
            - type: grid
              columns: 3
              square: false
              cards:
                - type: entity
                  entity: input_number.hvac_test_zone_1_temp
                  name: Stairs Temp
                - type: entity
                  entity: input_number.hvac_test_zone_2_temp
                  name: Bed 1 Temp
                - type: entity
                  entity: input_number.hvac_test_zone_3_temp
                  name: Bed 2 Temp
                - type: entity
                  entity: input_number.hvac_test_zone_4_temp
                  name: Bed 3 Temp
                - type: entity
                  entity: input_number.hvac_test_zone_5_temp
                  name: Master Bed Temp
                - type: entity
                  entity: input_number.hvac_test_zone_6_temp
                  name: Master Bath Temp
            - type: button
              name: Run Zone Loop Now
              icon: mdi:play-circle
              show_icon: true
              show_name: true
              tap_action:
                action: perform-action
                perform_action: automation.trigger
                target:
                  entity_id: automation.hvac_upstairs_zone_control_loop
                data:
                  skip_condition: true

      # ---------- TUNING (always available) ----------
      - type: entities
        title: Tuning
        show_header_toggle: false
        entities:
          - entity: input_number.hvac_min_airflow
            name: Min Airflow
          - entity: input_number.hvac_zone_sensitivity
            name: Sensitivity
          - entity: input_number.hvac_zone_deadband
            name: Deadband
          - entity: input_number.hvac_zone_weight_occupied
            name: Weight · Occupied
          - entity: input_number.hvac_zone_weight_unoccupied
            name: Weight · Unoccupied
          - entity: input_number.hvac_zone_loop_interval
            name: Loop Interval

      # ---------- OUTPUTS (always: this is what the loop actually did) ----------
      - type: glance
        title: "Dampers (relay ON = closed, OFF = open)"
        columns: 5
        entities:
          - { entity: switch.iotmug_16_relay_board_relay_1,  name: Stairs }
          - { entity: switch.iotmug_16_relay_board_relay_2,  name: Bed1-a }
          - { entity: switch.iotmug_16_relay_board_relay_3,  name: Bed1-b }
          - { entity: switch.iotmug_16_relay_board_relay_4,  name: Bed2-a }
          - { entity: switch.iotmug_16_relay_board_relay_5,  name: Bed2-b }
          - { entity: switch.iotmug_16_relay_board_relay_6,  name: Bed3 }
          - { entity: switch.iotmug_16_relay_board_relay_7,  name: MstrBed-a }
          - { entity: switch.iotmug_16_relay_board_relay_8,  name: MstrBed-b }
          - { entity: switch.iotmug_16_relay_board_relay_9,  name: MstrBath-a }
          - { entity: switch.iotmug_16_relay_board_relay_10, name: MstrBath-b }

      - type: gauge
        entity: sensor.upstairs_total_demand
        name: Total Demand
        min: 0
        max: 10
        severity: { green: 0, yellow: 5, red: 8 }

      - type: entities
        title: Last Automation Run
        show_header_toggle: false
        entities:
          - entity: automation.hvac_upstairs_zone_control_loop
            name: Loop
            secondary_info: last-triggered
      - type: logbook
        title: Recent Activity
        hours_to_show: 2
        max_lines: 20
        entities:
          - automation.hvac_upstairs_zone_control_loop

  # ================= DOWNSTAIRS =================
  - title: Downstairs
    icon: mdi:floor-plan
    cards:
      # ---------- ALWAYS ON ----------
      - type: horizontal-stack
        cards:
