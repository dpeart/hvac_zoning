# ==========================================
# HVAC ZONING: DOWNSTAIRS GLOBAL TUNING KNOBS
# ==========================================

input_number:
  # Thermal Deadband (e.g., 0.5°F)
  hvac_downstairs_zone_deadband:
    name: HVAC Downstairs Zone Deadband
    min: 0.1
    max: 2.0
    step: 0.1
    initial: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-lines

  # Sensitivity Constant (Scale for error to demand)
  hvac_downstairs_zone_sensitivity:
    name: HVAC Downstairs Zone Sensitivity
    min: 0.5
    max: 3.0
    step: 0.1
    initial: 1.0
    icon: mdi:tune

  # Occupied Weight Multiplier
  hvac_downstairs_zone_weight_occupied:
    name: HVAC Downstairs Zone Weight (Occupied)
    min: 1.0
    max: 2.0
    step: 0.05
    initial: 1.0
    icon: mdi:account-check

  # Unoccupied Weight Multiplier
  hvac_downstairs_zone_weight_unoccupied:
    name: HVAC Downstairs Zone Weight (Unoccupied)
    min: 0.2
    max: 1.0
    step: 0.05
    initial: 1.0
    icon: mdi:account-off

  # Loop Execution Interval (Seconds)
  hvac_downstairs_zone_loop_interval:
    name: HVAC Downstairs Zone Loop Interval
    min: 10
    max: 300
    step: 10
    initial: 90
    unit_of_measurement: "s"
    icon: mdi:timer-outline

  # Minimum Airflow (in register equivalents)
  hvac_downstairs_min_airflow:
    name: HVAC Downstairs Minimum Airflow (Registers)
    min: 1
    max: 13
    step: 1
    initial: 1
    unit_of_measurement: "registers"
    icon: mdi:air-filter

input_boolean:
  # Master toggle to enable/disable the downstairs zoning system
  hvac_downstairs_zoning_enabled:
    name: HVAC Downstairs Zoning System Enabled
    icon: mdi:power
