        unit_of_measurement: "registers"
        state: >
          {% if states('switch.iotmug_16_relay_board_relay_8') not in ['on', 'off'] or states('switch.iotmug_16_relay_board_relay_9') not in ['on', 'off'] %}unknown{% else %}{{ (1 if states('switch.iotmug_16_relay_board_relay_8') == 'off' else 0) + (1 if states('switch.iotmug_16_relay_board_relay_9') == 'off' else 0) }}{% endif %}
      - name: "Downstairs Zone 4 Min-Air Registers"
        unique_id: downstairs_zone_4_min_air_registers
        icon: mdi:air-filter
        unit_of_measurement: "registers"
        state: >
          {% set alloc = states('input_text.hvac_downstairs_min_airflow_allocation').split('|') %}
          {{ alloc[3] | int(0) }}
      - name: "Downstairs Zone 4 Register 1 Source"
        unique_id: downstairs_zone_4_register_1_source
        icon: mdi:source-branch
        state: >
          {% set relay_state = states('switch.iotmug_16_relay_board_relay_8') %}
          {% set demand = states('sensor.downstairs_zone_4_raw_registers') | int(0) %}
          {% set alloc = states('input_text.hvac_downstairs_min_airflow_allocation').split('|') %}
          {% set min_added = alloc[3] | int(0) %}
          {% if relay_state not in ['on', 'off'] %}Unknown
          {% elif relay_state == 'on' %}Closed
          {% elif 1 <= demand %}Demand-driven
          {% elif 1 <= demand + min_added %}Minimum airflow
          {% else %}Open (not demand/min-air allocation){% endif %}
      - name: "Downstairs Zone 4 Register 2 Source"
        unique_id: downstairs_zone_4_register_2_source
        icon: mdi:source-branch
        state: >
          {% set relay_state = states('switch.iotmug_16_relay_board_relay_9') %}
          {% set demand = states('sensor.downstairs_zone_4_raw_registers') | int(0) %}
          {% set alloc = states('input_text.hvac_downstairs_min_airflow_allocation').split('|') %}
          {% set min_added = alloc[3] | int(0) %}
          {% if relay_state not in ['on', 'off'] %}Unknown
          {% elif relay_state == 'on' %}Closed
          {% elif 2 <= demand %}Demand-driven
          {% elif 2 <= demand + min_added %}Minimum airflow
          {% else %}Open (not demand/min-air allocation){% endif %}
      - name: "Downstairs Zone 5 Actual Open Registers"
        unique_id: downstairs_zone_5_actual_open_registers
        icon: mdi:air-filter
        unit_of_measurement: "registers"
        state: >
          {% if states('switch.iotmug_16_relay_board_relay_10') not in ['on', 'off'] %}unknown{% else %}{{ (1 if states('switch.iotmug_16_relay_board_relay_10') == 'off' else 0) }}{% endif %}
      - name: "Downstairs Zone 5 Min-Air Registers"
        unique_id: downstairs_zone_5_min_air_registers
        icon: mdi:air-filter
        unit_of_measurement: "registers"
        state: >
          {% set alloc = states('input_text.hvac_downstairs_min_airflow_allocation').split('|') %}
          {{ alloc[4] | int(0) }}
      - name: "Downstairs Zone 5 Register 1 Source"
        unique_id: downstairs_zone_5_register_1_source
        icon: mdi:source-branch
        state: >
          {% set relay_state = states('switch.iotmug_16_relay_board_relay_10') %}
          {% set demand = states('sensor.downstairs_zone_5_raw_registers') | int(0) %}
          {% set alloc = states('input_text.hvac_downstairs_min_airflow_allocation').split('|') %}
          {% set min_added = alloc[4] | int(0) %}
          {% if relay_state not in ['on', 'off'] %}Unknown
          {% elif relay_state == 'on' %}Closed
          {% elif 1 <= demand %}Demand-driven
          {% elif 1 <= demand + min_added %}Minimum airflow
          {% else %}Open (not demand/min-air allocation){% endif %}
      - name: "Downstairs Actual Open Registers"
        unique_id: downstairs_actual_open_registers
        icon: mdi:air-filter
        unit_of_measurement: "registers"
        state: >
          {% if not is_number(states('sensor.downstairs_zone_1_actual_open_registers')) or not is_number(states('sensor.downstairs_zone_2_actual_open_registers')) or not is_number(states('sensor.downstairs_zone_3_actual_open_registers')) or not is_number(states('sensor.downstairs_zone_4_actual_open_registers')) or not is_number(states('sensor.downstairs_zone_5_actual_open_registers')) %}unknown
          {% else %}{{ states('sensor.downstairs_zone_1_actual_open_registers') | int(0) + states('sensor.downstairs_zone_2_actual_open_registers') | int(0) + states('sensor.downstairs_zone_3_actual_open_registers') | int(0) + states('sensor.downstairs_zone_4_actual_open_registers') | int(0) + states('sensor.downstairs_zone_5_actual_open_registers') | int(0) }}{% endif %}
      - name: "Downstairs Min-Air Registers Added"
        unique_id: downstairs_min_air_registers_added
        icon: mdi:air-filter
        unit_of_measurement: "registers"
        state: >
          {{ states('sensor.downstairs_zone_1_min_air_registers') | int(0) + states('sensor.downstairs_zone_2_min_air_registers') | int(0) + states('sensor.downstairs_zone_3_min_air_registers') | int(0) + states('sensor.downstairs_zone_4_min_air_registers') | int(0) + states('sensor.downstairs_zone_5_min_air_registers') | int(0) }}

      - name: "Downstairs Registers Requested"
        unique_id: downstairs_registers_requested
        icon: mdi:air-filter
        unit_of_measurement: "registers"
        state: >
          {{ states('sensor.downstairs_total_demand') | int(0) + states('sensor.downstairs_min_air_registers_added') | int(0) }}

      # --- TOTAL DEMAND (Sum of all zones) ---
      - name: "Downstairs Total Demand"
        unique_id: downstairs_total_demand
        icon: mdi:chart-bar
        unit_of_measurement: "registers"
        state: >
          {% set z1 = states('sensor.downstairs_zone_1_raw_registers') | int(0) %}
          {% set z2 = states('sensor.downstairs_zone_2_raw_registers') | int(0) %}
          {% set z3 = states('sensor.downstairs_zone_3_raw_registers') | int(0) %}
          {% set z4 = states('sensor.downstairs_zone_4_raw_registers') | int(0) %}
          {% set z5 = states('sensor.downstairs_zone_5_raw_registers') | int(0) %}
          {{ (z1 + z2 + z3 + z4 + z5) | int }}
