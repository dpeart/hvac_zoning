# ==========================================
# HVAC DOWNSTAIRS: DYNAMIC ZONE SENSORS & MATH
# ==========================================

template:
  - sensor:
      # --- ZONE 1: Kitchen ---
      - name: "Downstairs Zone 1 Temp"
        unique_id: downstairs_zone_1_temp
        icon: mdi:thermometer
        unit_of_measurement: "°F"
        state: >
          {% set test_mode = is_state('input_boolean.hvac_downstairs_test_mode', 'on') %}
          {% set temp_ent = states('input_text.hvac_downstairs_zone_1_temp_entity') %}
          {{ states('input_number.hvac_downstairs_test_zone_1_temp') | float(70) | round(1) if test_mode else (states(temp_ent) | float(70) | round(1) if is_number(states(temp_ent)) else 'unknown') }}

      - name: "Downstairs Zone 1 Error"
        unique_id: downstairs_zone_1_error
        icon: mdi:math-log
        unit_of_measurement: "°F"
        state: >
          {% set test_mode = is_state('input_boolean.hvac_downstairs_test_mode', 'on') %}
          {% set temp_ent = states('input_text.hvac_downstairs_zone_1_temp_entity') %}
          {% set target = states('input_number.hvac_downstairs_test_target_temp') | float(72) if test_mode else state_attr('climate.downstairs_nativezone', 'temperature') | float(72) %}
          {% set current = states('input_number.hvac_downstairs_test_zone_1_temp') | float(70) if test_mode else states(temp_ent) %}
          {% set hvac_action = states('input_select.hvac_downstairs_test_action') if test_mode else state_attr('climate.downstairs_nativezone', 'hvac_action') %}
          {% if not is_number(current) or not is_number(target) %}
            {{ 'unknown' }}
          {% elif hvac_action == 'cooling' %}
            {{ (current | float - target | float) | round(2) }}
          {% elif hvac_action == 'heating' %}
            {{ (target | float - current | float) | round(2) }}
          {% else %}
            {{ 0.0 }}
          {% endif %}

      - name: "Downstairs Zone 1 Demand"
        unique_id: downstairs_zone_1_demand
        icon: mdi:chart-line
        state: >
          {% set error = states('sensor.downstairs_zone_1_error') | float(0) %}
          {% set db = states('input_number.hvac_downstairs_zone_deadband') | float(0.5) %}
          {% set sensitivity = states('input_number.hvac_downstairs_zone_sensitivity') | float(1.0) %}
          {% set occ_ent = states('input_text.hvac_downstairs_zone_1_occ_entity') %}
          {% set is_occ = is_state(occ_ent, 'on') %}
          {% set w_occ = states('input_number.hvac_downstairs_zone_weight_occupied') | float(1.0) %}
          {% set w_unocc = states('input_number.hvac_downstairs_zone_weight_unoccupied') | float(0.8) %}
          {% if error <= db %}
            {{ 0.0 }}
          {% else %}
            {% set raw_demand = (error - db) / sensitivity %}
            {% set raw_demand = [raw_demand, 1.0] | min %}
            {% set multiplier = w_occ if is_occ else w_unocc %}
            {{ (raw_demand * multiplier) | round(2) }}
          {% endif %}

      - name: "Downstairs Zone 1 Raw Registers"
        unique_id: downstairs_zone_1_raw_registers
        icon: mdi:air-filter
        state: >
          {% set demand = states('sensor.downstairs_zone_1_demand') | float(0) %}
          {% set n_reg = states('input_number.hvac_downstairs_zone_1_registers') | float(2) %}
          {{ (demand * n_reg) | round(0, 'ceil') | int }}


