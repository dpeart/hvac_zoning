automation:
  - id: upstairs_initialize_test_zone_temps
    alias: "HVAC Upstairs: Initialize Test Zone Temperatures"
    description: "Copies assigned zone sensor values into test temperature sliders when upstairs test mode is enabled."
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_test_mode
        to: "on"
    mode: restart
    action:
      - repeat:
          for_each:
            - zone: Zone 1
              sensor_helper: input_text.upstairs_hvac_zone_1_temp_entity
              test_helper: input_number.hvac_test_zone_1_temp
            - zone: Zone 2
              sensor_helper: input_text.upstairs_hvac_zone_2_temp_entity
              test_helper: input_number.hvac_test_zone_2_temp
            - zone: Zone 3
              sensor_helper: input_text.upstairs_hvac_zone_3_temp_entity
              test_helper: input_number.hvac_test_zone_3_temp
            - zone: Zone 4
              sensor_helper: input_text.upstairs_hvac_zone_4_temp_entity
              test_helper: input_number.hvac_test_zone_4_temp
            - zone: Zone 5
              sensor_helper: input_text.upstairs_hvac_zone_5_temp_entity
              test_helper: input_number.hvac_test_zone_5_temp
            - zone: Zone 6
              sensor_helper: input_text.upstairs_hvac_zone_6_temp_entity
              test_helper: input_number.hvac_test_zone_6_temp
          sequence:
            - variables:
                sensor_entity: "{{ states(repeat.item.sensor_helper) }}"
                sensor_value: "{{ states(sensor_entity) }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ is_number(sensor_value) and 50 <= (sensor_value | float) <= 90 }}"
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: "{{ repeat.item.test_helper }}"
                      data:
                        value: "{{ sensor_value | float | round(1) }}"
              default:
                - service: system_log.write
                  data:
                    level: warning
                    message: >
                      HVAC Upstairs test mode: {{ repeat.item.zone }} sensor
                      {{ sensor_entity }} has invalid or out-of-range value
                      {{ sensor_value }}; test temperature was not initialized.

  - id: upstairs_deenergize_relays_on_disable
    alias: "HVAC Upstairs: De-energize Relays When Zoning Disabled"
    description: "Ensures all upstairs active damper relays are de-energized whenever the upstairs zoning system is disabled."
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_zoning_enabled
        to: "off"
    mode: single
    action:
      - service: homeassistant.turn_off
        target:
          entity_id:
            - switch.iotmug_16_relay_board_relay_1
            - switch.iotmug_16_relay_board_relay_2
            - switch.iotmug_16_relay_board_relay_3
            - switch.iotmug_16_relay_board_relay_4
            - switch.iotmug_16_relay_board_relay_5
            - switch.iotmug_16_relay_board_relay_6
            - switch.iotmug_16_relay_board_relay_7
            - switch.iotmug_16_relay_board_relay_8
            - switch.iotmug_16_relay_board_relay_9
            - switch.iotmug_16_relay_board_relay_10
      - service: system_log.write
        data:
          level: warning
          message: "HVAC Upstairs zoning disabled: all relays de-energized."

  - id: upstairs_hvac_control_loop
    alias: "HVAC Upstairs: Zone Control Loop"
    description: "Evaluates zone demands, applies minimum airflow constraints, and drives ESPHome damper relays. Runs every 10s in test mode, otherwise on the configured loop interval."
    trigger:
      - platform: time_pattern
        seconds: "/10"
    condition:
      - condition: template
        value_template: >
          {{ is_state('input_boolean.hvac_test_mode', 'on')
             or (now().timestamp() | int) % states('input_number.hvac_zone_loop_interval') | int(90) == 0 }}
      - condition: template
        value_template: "{{ states('input_boolean.hvac_zoning_enabled') == 'on' }}"
    mode: single
    variables:
      test_mode: "{{ is_state('input_boolean.hvac_test_mode', 'on') }}"
      hvac_action: >
        {{ iif(test_mode,
               states('input_select.hvac_test_action'),
               state_attr('climate.upstairs_nativezone', 'hvac_action') | string | lower) }}
      r1: "{{ states('sensor.upstairs_zone_1_raw_registers') | int(0) }}"
      r2: "{{ states('sensor.upstairs_zone_2_raw_registers') | int(0) }}"
      r3: "{{ states('sensor.upstairs_zone_3_raw_registers') | int(0) }}"
      r4: "{{ states('sensor.upstairs_zone_4_raw_registers') | int(0) }}"
      r5: "{{ states('sensor.upstairs_zone_5_raw_registers') | int(0) }}"
      r6: "{{ states('sensor.upstairs_zone_6_raw_registers') | int(0) }}"
      total_demand: "{{ r1 + r2 + r3 + r4 + r5 + r6 }}"
      total_max_registers: 10
      min_airflow: "{{ [states('input_number.hvac_min_airflow') | int(1), 10] | min }}"
      # If total demand is below the minimum airflow, allocate the deficit
      # one register at a time in round-robin rotation across zones
      # (Master Bath -> Bed 1 -> Stairs -> Bed 2 -> Master Bed -> Bed 3),
      # repeating passes in the same order until the deficit is satisfied.
      # Zones already at their physical relay capacity (Z1=1, Z2=2, Z3=2,
      # Z4=1, Z5=2, Z6=2) are skipped. Two passes cover every zone's maximum
      # spare of 2. NOTE: only Jinja2-core features are used here (namespace
      # scalar mutation); the `combine` filter is NOT available in HA and
      # previously caused the whole automation to fail to load.
      deficit: "{{ [min_airflow - total_demand, 0] | max }}"
      ns_alloc: >
        {% set ns = namespace(left = deficit | int(0),
                              e1 = 0, e2 = 0, e3 = 0, e4 = 0, e5 = 0, e6 = 0) %}
        {% for _pass in [1, 2] %}
          {% if ns.left > 0 and ns.e6 < [2 - r6 | int(0), 0] | max %}{% set ns.e6 = ns.e6 + 1 %}{% set ns.left = ns.left - 1 %}{% endif %}
          {% if ns.left > 0 and ns.e2 < [2 - r2 | int(0), 0] | max %}{% set ns.e2 = ns.e2 + 1 %}{% set ns.left = ns.left - 1 %}{% endif %}
          {% if ns.left > 0 and ns.e1 < [1 - r1 | int(0), 0] | max %}{% set ns.e1 = ns.e1 + 1 %}{% set ns.left = ns.left - 1 %}{% endif %}
          {% if ns.left > 0 and ns.e3 < [2 - r3 | int(0), 0] | max %}{% set ns.e3 = ns.e3 + 1 %}{% set ns.left = ns.left - 1 %}{% endif %}
          {% if ns.left > 0 and ns.e5 < [2 - r5 | int(0), 0] | max %}{% set ns.e5 = ns.e5 + 1 %}{% set ns.left = ns.left - 1 %}{% endif %}
          {% if ns.left > 0 and ns.e4 < [1 - r4 | int(0), 0] | max %}{% set ns.e4 = ns.e4 + 1 %}{% set ns.left = ns.left - 1 %}{% endif %}
        {% endfor %}
        {{ ns.e1 }}|{{ ns.e2 }}|{{ ns.e3 }}|{{ ns.e4 }}|{{ ns.e5 }}|{{ ns.e6 }}
      z1_extra: "{{ ns_alloc.split('|')[0] | int(0) }}"
      z2_extra: "{{ ns_alloc.split('|')[1] | int(0) }}"
      z3_extra: "{{ ns_alloc.split('|')[2] | int(0) }}"
      z4_extra: "{{ ns_alloc.split('|')[3] | int(0) }}"
      z5_extra: "{{ ns_alloc.split('|')[4] | int(0) }}"
      z6_extra: "{{ ns_alloc.split('|')[5] | int(0) }}"
      r1_eff: "{{ r1 + z1_extra }}"
      r2_eff: "{{ r2 + z2_extra }}"
      r3_eff: "{{ r3 + z3_extra }}"
      r4_eff: "{{ r4 + z4_extra }}"
      r5_eff: "{{ r5 + z5_extra }}"
      r6_eff: "{{ r6 + z6_extra }}"
    action:
      - choose:
          # --- ZONING DISABLED: DE-ENERGIZE ALL ACTIVE RELAYS (UNUSED 11-16 STAY OFF) ---
          - conditions:
              - condition: template
                value_template: "{{ not is_state('input_boolean.hvac_zoning_enabled', 'on') }}"
            sequence:
              - service: homeassistant.turn_off
                target:
                  entity_id:
                    - switch.iotmug_16_relay_board_relay_1
                    - switch.iotmug_16_relay_board_relay_2
                    - switch.iotmug_16_relay_board_relay_3
                    - switch.iotmug_16_relay_board_relay_4
                    - switch.iotmug_16_relay_board_relay_5
                    - switch.iotmug_16_relay_board_relay_6
                    - switch.iotmug_16_relay_board_relay_7
                    - switch.iotmug_16_relay_board_relay_8
                    - switch.iotmug_16_relay_board_relay_9
                    - switch.iotmug_16_relay_board_relay_10
              - service: system_log.write
                data:
                  level: warning
                  message: "HVAC Upstairs zoning disabled: all relays de-energized."
          # --- ACTIVE CONDITIONING (Heating or Cooling) ---
          - conditions:
              - condition: template
                value_template: "{{ hvac_action in ['heating', 'cooling'] }}"
            sequence:
              - service: system_log.write
                data:
                  level: info
                  message: >
                    HVAC Upstairs Active Loop: Action={{ hvac_action }}, 
                    Zone Demands -> Z1:{{r1}}, Z2:{{r2}}, Z3:{{r3}}, Z4:{{r4}}, Z5:{{r5}}, Z6:{{r6}}, TotalDemand={{ total_demand }}

              # --- SAFEGUARD: Enforce Minimum Airflow ---
              # When total demand is below the minimum airflow, the deficit is
              # allocated across zones (stairs first) via the rN_eff variables.
              # This block only logs the event.
              - choose:
                  - conditions: "{{ deficit > 0 }}"
                    sequence:
                      - service: system_log.write
                        data:
                          level: warning
                          message: >
                            HVAC Minimum Airflow Enforced: Total demand={{ total_demand }}, Min={{ min_airflow }}, Deficit={{ deficit }}. Effective demands -> Z1:{{r1_eff}}, Z2:{{r2_eff}}, Z3:{{r3_eff}}, Z4:{{r4_eff}}, Z5:{{r5_eff}}, Z6:{{r6_eff}}.

              # Unused relays (11-16) are left alone -> default non-energized.

              # --- ZONE 1: Stairs (Relay 1) ---
              - choose:
                  - conditions: "{{ r1_eff >= 1 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_1
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_1

              # --- ZONE 2: Bed 1 (Relays 2, 3) ---
              - choose:
                  - conditions: "{{ r2_eff >= 1 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_2
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_2
              - choose:
                  - conditions: "{{ r2_eff >= 2 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_3
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_3
              # --- ZONE 3: Bed 2 (Relays 4, 5) ---
              - choose:
                  - conditions: "{{ r3_eff >= 1 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_4
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_4
              - choose:
                  - conditions: "{{ r3_eff >= 2 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_5
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_5

              # --- ZONE 4: Bed 3 (Relay 6) ---
              - choose:
                  - conditions: "{{ r4_eff >= 1 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_6
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_6

              # --- ZONE 5: Master Bed (Relays 7, 8) ---
              - choose:
                  - conditions: "{{ r5_eff >= 1 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_7
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_7
              - choose:
                  - conditions: "{{ r5_eff >= 2 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_8
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_8
              # --- ZONE 6: Master Bath (Relays 9, 10) ---
              - choose:
                  - conditions: "{{ r6_eff >= 1 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_9
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_9
              - choose:
                  - conditions: "{{ r6_eff >= 2 }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target:
                          entity_id: switch.iotmug_16_relay_board_relay_10
                default:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: switch.iotmug_16_relay_board_relay_10
        default:
          # --- FAILSAFE: OPEN ALL ACTIVE DAMPERS; KEEP UNUSED RELAYS CLOSED ---
          - service: homeassistant.turn_off
            target:
              entity_id:
                - switch.iotmug_16_relay_board_relay_1
                - switch.iotmug_16_relay_board_relay_2
                - switch.iotmug_16_relay_board_relay_3
                - switch.iotmug_16_relay_board_relay_4
                - switch.iotmug_16_relay_board_relay_5
                - switch.iotmug_16_relay_board_relay_6
                - switch.iotmug_16_relay_board_relay_7
                - switch.iotmug_16_relay_board_relay_8
                - switch.iotmug_16_relay_board_relay_9
                - switch.iotmug_16_relay_board_relay_10
          - service: system_log.write
            data:
              level: warning
              message: >
                HVAC Upstairs Failsafe Active: hvac_action='{{ hvac_action }}'. Active dampers opened (de-energized); unused relays left non-energized.
