automation:
  - id: upstairs_initialize_test_zone_temps
    alias: "HVAC Upstairs: Initialize Test Zone Temperatures"
    description: "Copies assigned zone sensor values into test temperature sliders when upstairs test mode is enabled."
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_test_mode
        to: "on"
    mode: restart
    action:
      - repeat:
          for_each:
            - zone: Zone 1
              sensor_helper: input_text.upstairs_hvac_zone_1_temp_entity
              test_helper: input_number.hvac_test_zone_1_temp
            - zone: Zone 2
              sensor_helper: input_text.upstairs_hvac_zone_2_temp_entity
              test_helper: input_number.hvac_test_zone_2_temp
            - zone: Zone 3
              sensor_helper: input_text.upstairs_hvac_zone_3_temp_entity
              test_helper: input_number.hvac_test_zone_3_temp
            - zone: Zone 4
              sensor_helper: input_text.upstairs_hvac_zone_4_temp_entity
              test_helper: input_number.hvac_test_zone_4_temp
            - zone: Zone 5
              sensor_helper: input_text.upstairs_hvac_zone_5_temp_entity
              test_helper: input_number.hvac_test_zone_5_temp
            - zone: Zone 6
              sensor_helper: input_text.upstairs_hvac_zone_6_temp_entity
              test_helper: input_number.hvac_test_zone_6_temp
          sequence:
            - variables:
                sensor_entity: "{{ states(repeat.item.sensor_helper) }}"
                sensor_value: "{{ states(sensor_entity) }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ is_number(sensor_value) and 50 <= (sensor_value | float) <= 90 }}"
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: "{{ repeat.item.test_helper }}"
                      data:
                        value: "{{ sensor_value | float | round(1) }}"
              default:
                - service: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.test_helper }}"
                  data:
                    value: "{{ states('input_number.hvac_test_target_temp') | float(72) }}"
                - service: system_log.write
                  data:
                    level: warning
                    message: >
                      HVAC Upstairs test mode: {{ repeat.item.zone }} sensor
                      {{ sensor_entity }} has invalid or out-of-range value
                      {{ sensor_value }}; test temperature was reset to the test target.

  - id: upstairs_deenergize_relays_on_disable
    alias: "HVAC Upstairs: De-energize Relays When Zoning Disabled"
    description: "Ensures all upstairs active damper relays are de-energized whenever the upstairs zoning system is disabled."
    trigger:
      - platform: state
        entity_id: input_boolean.hvac_zoning_enabled
        to: "off"
      - platform: homeassistant
        event: start
      - platform: time_pattern
        seconds: "/30"
    condition:
      - condition: state
        entity_id: input_boolean.hvac_zoning_enabled
        state: "off"
    mode: single
    action:
      - repeat:
          for_each:
            - switch.iotmug_16_relay_board_relay_1
            - switch.iotmug_16_relay_board_relay_2
            - switch.iotmug_16_relay_board_relay_3
            - switch.iotmug_16_relay_board_relay_4
            - switch.iotmug_16_relay_board_relay_5
            - switch.iotmug_16_relay_board_relay_6
            - switch.iotmug_16_relay_board_relay_7
            - switch.iotmug_16_relay_board_relay_8
            - switch.iotmug_16_relay_board_relay_9
            - switch.iotmug_16_relay_board_relay_10
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ not is_state(repeat.item, 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.hvac_upstairs_min_airflow_allocation
        data:
          value: "0|0|0|0|0|0"
      - service: system_log.write
        data:
          level: warning
          message: "HVAC Upstairs zoning disabled: all relays de-energized."

  - id: upstairs_open_dampers_when_idle
    alias: "HVAC Upstairs: Open Dampers When Thermostat Idle"
    description: "Opens active upstairs dampers when the thermostat reports idle in production mode."
    trigger:
      - platform: state
        entity_id: climate.upstairs_nativezone
        attribute: hvac_action
        to: idle
    condition:
      - condition: state
        entity_id: input_boolean.hvac_zoning_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hvac_test_mode
        state: "off"
    mode: restart
    action:
      - repeat:
          for_each:
            - switch.iotmug_16_relay_board_relay_1
            - switch.iotmug_16_relay_board_relay_2
            - switch.iotmug_16_relay_board_relay_3
            - switch.iotmug_16_relay_board_relay_4
            - switch.iotmug_16_relay_board_relay_5
            - switch.iotmug_16_relay_board_relay_6
            - switch.iotmug_16_relay_board_relay_7
            - switch.iotmug_16_relay_board_relay_8
            - switch.iotmug_16_relay_board_relay_9
            - switch.iotmug_16_relay_board_relay_10
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state(repeat.item, 'on')
                           and is_state('input_boolean.hvac_zoning_enabled', 'on')
                           and is_state('input_boolean.hvac_test_mode', 'off')
                           and state_attr('climate.upstairs_nativezone', 'hvac_action') == 'idle' }}
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"
      - service: system_log.write
        data:
          level: info
          message: "HVAC Upstairs thermostat reported idle: active dampers opened."

  - id: upstairs_open_dampers_on_temp_sensor_failure
    alias: "HVAC Upstairs: Open Affected Dampers on Temperature Sensor Failure"
    description: "Opens only the affected zone's dampers when its production temperature sensor becomes unknown or unavailable."
    trigger:
      - platform: state
        entity_id:
          - sensor.upstairs_zone_1_temp
          - sensor.upstairs_zone_2_temp
          - sensor.upstairs_zone_3_temp
          - sensor.upstairs_zone_4_temp
          - sensor.upstairs_zone_5_temp
          - sensor.upstairs_zone_6_temp
        to: "unknown"
      - platform: state
        entity_id:
          - sensor.upstairs_zone_1_temp
          - sensor.upstairs_zone_2_temp
          - sensor.upstairs_zone_3_temp
          - sensor.upstairs_zone_4_temp
          - sensor.upstairs_zone_5_temp
          - sensor.upstairs_zone_6_temp
        to: "unavailable"
    condition:
      - condition: state
        entity_id: input_boolean.hvac_zoning_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hvac_test_mode
        state: "off"
      - condition: template
        value_template: "{{ states(trigger.entity_id) in ['unknown', 'unavailable'] }}"
    mode: queued
    action:
      - variables:
          failed_zone_relays: >
            {% set relays = {
              'sensor.upstairs_zone_1_temp': ['switch.iotmug_16_relay_board_relay_1'],
              'sensor.upstairs_zone_2_temp': ['switch.iotmug_16_relay_board_relay_2', 'switch.iotmug_16_relay_board_relay_3'],
              'sensor.upstairs_zone_3_temp': ['switch.iotmug_16_relay_board_relay_4', 'switch.iotmug_16_relay_board_relay_5'],
              'sensor.upstairs_zone_4_temp': ['switch.iotmug_16_relay_board_relay_6'],
              'sensor.upstairs_zone_5_temp': ['switch.iotmug_16_relay_board_relay_7', 'switch.iotmug_16_relay_board_relay_8'],
              'sensor.upstairs_zone_6_temp': ['switch.iotmug_16_relay_board_relay_9', 'switch.iotmug_16_relay_board_relay_10']
            } %}
            {{ relays.get(trigger.entity_id, []) }}
      - service: homeassistant.turn_off
        target:
          entity_id: "{{ failed_zone_relays }}"
      - service: system_log.write
        data:
          level: warning
          message: >
            HVAC Upstairs sensor failure: {{ trigger.entity_id }} is {{ states(trigger.entity_id) }};
            opened affected zone dampers ({{ failed_zone_relays | join(', ') }}).

  - id: upstairs_hvac_control_loop
    alias: "HVAC Upstairs: Zone Control Loop"
    description: "Evaluates zone demands, applies minimum airflow constraints, and drives ESPHome damper relays. Runs every 10s in test mode, otherwise on the configured loop interval."
    trigger:
      - platform: time_pattern
        seconds: "/10"
    condition:
      - condition: template
        value_template: >
          {{ is_state('input_boolean.hvac_test_mode', 'on')
             or (now().timestamp() | int) % states('input_number.hvac_zone_loop_interval') | int(90) == 0 }}
      - condition: template
        value_template: "{{ states('input_boolean.hvac_zoning_enabled') == 'on' }}"
    mode: single
    variables:
      test_mode: "{{ is_state('input_boolean.hvac_test_mode', 'on') }}"
      hvac_action: >
        {{ iif(test_mode,
               states('input_select.hvac_test_action'),
               state_attr('climate.upstairs_nativezone', 'hvac_action') | string | lower) }}
      # A failed zone sensor requests all of that zone's registers open. This
      # also prevents minimum-airflow allocation from targeting the failed zone.
      r1: "{{ states('sensor.upstairs_zone_1_raw_registers') | int(0) if is_number(states('sensor.upstairs_zone_1_temp')) else 1 }}"
      r2: "{{ states('sensor.upstairs_zone_2_raw_registers') | int(0) if is_number(states('sensor.upstairs_zone_2_temp')) else 2 }}"
      r3: "{{ states('sensor.upstairs_zone_3_raw_registers') | int(0) if is_number(states('sensor.upstairs_zone_3_temp')) else 2 }}"
      r4: "{{ states('sensor.upstairs_zone_4_raw_registers') | int(0) if is_number(states('sensor.upstairs_zone_4_temp')) else 1 }}"
      r5: "{{ states('sensor.upstairs_zone_5_raw_registers') | int(0) if is_number(states('sensor.upstairs_zone_5_temp')) else 2 }}"
      r6: "{{ states('sensor.upstairs_zone_6_raw_registers') | int(0) if is_number(states('sensor.upstairs_zone_6_temp')) else 2 }}"
      total_demand: "{{ r1 + r2 + r3 + r4 + r5 + r6 }}"
      total_max_registers: 10
      min_airflow: "{{ [states('input_number.hvac_min_airflow') | int(1), 10] | min }}"
      # When demand exists, allocate the minimum-airflow deficit one register
      # per zone per pass in signed-error priority order. If total demand is
      # zero, fill the coolest eligible zone (highest signed error) to its
      # physical relay capacity before moving to the next-coolest. This keeps
      # the minimum-airflow register floor while concentrating airflow where
      # it best reduces temperature differences. Thermostat zone (Z5) wins ties.
      # NOTE: only Jinja2-core features are used here (namespace scalar
      # mutation); the `combine` filter is NOT available in HA and previously
      # caused the whole automation to fail to load.
      deficit: "{{ [min_airflow - total_demand, 0] | max }}"
      # Signed errors (same convention as the *_error sensors):
      # positive = needs airflow in the active mode.
      err1: "{{ states('sensor.upstairs_zone_1_error') | float(-9999) }}"
      err2: "{{ states('sensor.upstairs_zone_2_error') | float(-9999) }}"
      err3: "{{ states('sensor.upstairs_zone_3_error') | float(-9999) }}"
      err4: "{{ states('sensor.upstairs_zone_4_error') | float(-9999) }}"
      err5: "{{ states('sensor.upstairs_zone_5_error') | float(-9999) }}"
      err6: "{{ states('sensor.upstairs_zone_6_error') | float(-9999) }}"
      ns_alloc: >
        {% set ns = namespace(left = deficit | int(0),
                              e1 = 0, e2 = 0, e3 = 0, e4 = 0, e5 = 0, e6 = 0,
                              a1 = 0, a2 = 0, a3 = 0, a4 = 0, a5 = 0, a6 = 0) %}
        {# Two passes; at most one register per zone per pass. When any zone
           has a positive error, allocate by highest error first (ties ->
           thermostat zone Z5 first, then Z6 -> Z2 -> Z1 -> Z3 -> Z4). When NO
           zone needs airflow (all errors <= 0) but the system is still
           calling, serve the zone closest to setpoint (least over-met,
           highest/least-negative error) first, thermostat zone winning ties.
           Zones at relay capacity are skipped. NOTE: only Jinja2-core features
           are used (namespace scalar mutation); the `combine` filter is NOT
           available in HA. #}
        {% for _pass in [1, 2] %}
          {% set ns.a1 = 0 %}{% set ns.a2 = 0 %}{% set ns.a3 = 0 %}{% set ns.a4 = 0 %}{% set ns.a5 = 0 %}{% set ns.a6 = 0 %}
          {% for _j in range(0, 6) %}
            {% if ns.left > 0 %}
              {% set s1 = [1 - r1 | int(0) - ns.e1, 0] | max %}
              {% set s2 = [2 - r2 | int(0) - ns.e2, 0] | max %}
              {% set s3 = [2 - r3 | int(0) - ns.e3, 0] | max %}
              {% set s4 = [1 - r4 | int(0) - ns.e4, 0] | max %}
              {% set s5 = [2 - r5 | int(0) - ns.e5, 0] | max %}
              {% set s6 = [2 - r6 | int(0) - ns.e6, 0] | max %}
              {% if total_demand | int(0) > 0 %}
                {% set c1 = err1 if (s1 > 0 and ns.a1 == 0) else -9999 %}
                {% set c2 = err2 if (s2 > 0 and ns.a2 == 0) else -9999 %}
                {% set c3 = err3 if (s3 > 0 and ns.a3 == 0) else -9999 %}
                {% set c4 = err4 if (s4 > 0 and ns.a4 == 0) else -9999 %}
                {% set c5 = err5 if (s5 > 0 and ns.a5 == 0) else -9999 %}
                {% set c6 = err6 if (s6 > 0 and ns.a6 == 0) else -9999 %}
                {% set emax = [c1, c2, c3, c4, c5, c6] | max %}
                {% if c5 >= emax %}{% set ns.e5 = ns.e5 + 1 %}{% set ns.left = ns.left - 1 %}{% set ns.a5 = 1 %}
                {% elif c6 >= emax %}{% set ns.e6 = ns.e6 + 1 %}{% set ns.left = ns.left - 1 %}{% set ns.a6 = 1 %}
                {% elif c2 >= emax %}{% set ns.e2 = ns.e2 + 1 %}{% set ns.left = ns.left - 1 %}{% set ns.a2 = 1 %}
                {% elif c1 >= emax %}{% set ns.e1 = ns.e1 + 1 %}{% set ns.left = ns.left - 1 %}{% set ns.a1 = 1 %}
                {% elif c3 >= emax %}{% set ns.e3 = ns.e3 + 1 %}{% set ns.left = ns.left - 1 %}{% set ns.a3 = 1 %}
                {% elif c4 >= emax %}{% set ns.e4 = ns.e4 + 1 %}{% set ns.left = ns.left - 1 %}{% set ns.a4 = 1 %}
                {% endif %}
              {% else %}
                                                                                {# Total demand is zero: repeatedly fill the eligible zone
                   with the highest signed error to physical capacity before
                   moving to the next. The configured minimum register floor
                   is unchanged; this concentrates it in the coolest zones.
                   Thermostat zone wins ties. #}
                {% set c1 = err1 if (s1 > 0) else -9999 %}
                {% set c2 = err2 if (s2 > 0) else -9999 %}
                {% set c3 = err3 if (s3 > 0) else -9999 %}
                {% set c4 = err4 if (s4 > 0) else -9999 %}
                {% set c5 = err5 if (s5 > 0) else -9999 %}
                {% set c6 = err6 if (s6 > 0) else -9999 %}
                {% set emax = [c1, c2, c3, c4, c5, c6] | max %}
                {% if c5 >= emax %}{% set ns.e5 = ns.e5 + 1 %}{% set ns.left = ns.left - 1 %}
                {% elif c6 >= emax %}{% set ns.e6 = ns.e6 + 1 %}{% set ns.left = ns.left - 1 %}
                {% elif c2 >= emax %}{% set ns.e2 = ns.e2 + 1 %}{% set ns.left = ns.left - 1 %}
                {% elif c1 >= emax %}{% set ns.e1 = ns.e1 + 1 %}{% set ns.left = ns.left - 1 %}
                {% elif c3 >= emax %}{% set ns.e3 = ns.e3 + 1 %}{% set ns.left = ns.left - 1 %}
                {% elif c4 >= emax %}{% set ns.e4 = ns.e4 + 1 %}{% set ns.left = ns.left - 1 %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.e1 }}|{{ ns.e2 }}|{{ ns.e3 }}|{{ ns.e4 }}|{{ ns.e5 }}|{{ ns.e6 }}
      z1_extra: "{{ ns_alloc.split('|')[0] | int(0) }}"
      z2_extra: "{{ ns_alloc.split('|')[1] | int(0) }}"
      z3_extra: "{{ ns_alloc.split('|')[2] | int(0) }}"
      z4_extra: "{{ ns_alloc.split('|')[3] | int(0) }}"
      z5_extra: "{{ ns_alloc.split('|')[4] | int(0) }}"
      z6_extra: "{{ ns_alloc.split('|')[5] | int(0) }}"
      r1_eff: "{{ r1 + z1_extra }}"
      r2_eff: "{{ r2 + z2_extra }}"
      r3_eff: "{{ r3 + z3_extra }}"
      r4_eff: "{{ r4 + z4_extra }}"
      r5_eff: "{{ r5 + z5_extra }}"
      r6_eff: "{{ r6 + z6_extra }}"
    action:
      - choose:
          # --- ZONING DISABLED: DE-ENERGIZE ALL ACTIVE RELAYS (UNUSED 11-16 STAY OFF) ---
          - conditions:
              - condition: template
                value_template: "{{ not is_state('input_boolean.hvac_zoning_enabled', 'on') }}"
            sequence:
              - service: homeassistant.turn_off
                target:
                  entity_id:
                    - switch.iotmug_16_relay_board_relay_1
                    - switch.iotmug_16_relay_board_relay_2
                    - switch.iotmug_16_relay_board_relay_3
                    - switch.iotmug_16_relay_board_relay_4
                    - switch.iotmug_16_relay_board_relay_5
                    - switch.iotmug_16_relay_board_relay_6
                    - switch.iotmug_16_relay_board_relay_7
                    - switch.iotmug_16_relay_board_relay_8
                    - switch.iotmug_16_relay_board_relay_9
                    - switch.iotmug_16_relay_board_relay_10
              - service: system_log.write
                data:
                  level: warning
                  message: "HVAC Upstairs zoning disabled: all relays de-energized."
          # --- ACTIVE CONDITIONING (Heating or Cooling) ---
          - conditions:
              - condition: template
                value_template: "{{ hvac_action in ['heating', 'cooling'] }}"
            sequence:
              - service: system_log.write
                data:
                  level: info
                  message: >
                    HVAC Upstairs Active Loop: Action={{ hvac_action }}, 
                    Zone Demands -> Z1:{{r1}}, Z2:{{r2}}, Z3:{{r3}}, Z4:{{r4}}, Z5:{{r5}}, Z6:{{r6}}, TotalDemand={{ total_demand }}

              # --- SAFEGUARD: Enforce Minimum Airflow ---
              # When total demand is below the minimum airflow, the deficit is
              # allocated across zones (stairs first) via the rN_eff variables.
              # This block only logs the event.
              - choose:
                  - conditions: "{{ deficit > 0 }}"
                    sequence:
                      - service: system_log.write
                        data:
                          level: warning
                          message: >
                            HVAC Minimum Airflow Enforced: Total demand={{ total_demand }}, Min={{ min_airflow }}, Deficit={{ deficit }}. Effective demands -> Z1:{{r1_eff}}, Z2:{{r2_eff}}, Z3:{{r3_eff}}, Z4:{{r4_eff}}, Z5:{{r5_eff}}, Z6:{{r6_eff}}.

              # Unused relays (11-16) are left alone -> default non-energized.

              - service: input_text.set_value
                target:
                  entity_id: input_text.hvac_upstairs_min_airflow_allocation
                data:
                  value: "{{ z1_extra }}|{{ z2_extra }}|{{ z3_extra }}|{{ z4_extra }}|{{ z5_extra }}|{{ z6_extra }}"

              # --- ZONE 1: Stairs (Relay 1) ---
              - choose:
                - conditions: "{{ r1_eff >= 1 and not is_state('switch.iotmug_16_relay_board_relay_1', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_1
                - conditions: "{{ r1_eff < 1 and not is_state('switch.iotmug_16_relay_board_relay_1', 'on') }}"
                  sequence:
                    - service: homeassistant.turn_on
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_1

              # --- ZONE 2: Bed 1 (Relays 2, 3) ---
              - choose:
                - conditions: "{{ r2_eff >= 1 and not is_state('switch.iotmug_16_relay_board_relay_2', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_2
                - conditions: "{{ r2_eff < 1 and not is_state('switch.iotmug_16_relay_board_relay_2', 'on') }}"
                  sequence:
                    - service: homeassistant.turn_on
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_2
              - choose:
                - conditions: "{{ r2_eff >= 2 and not is_state('switch.iotmug_16_relay_board_relay_3', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_3
                - conditions: "{{ r2_eff < 2 and not is_state('switch.iotmug_16_relay_board_relay_3', 'on') }}"
                  sequence:
                    - service: homeassistant.turn_on
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_3
              # --- ZONE 3: Bed 2 (Relays 4, 5) ---
              - choose:
                - conditions: "{{ r3_eff >= 1 and not is_state('switch.iotmug_16_relay_board_relay_4', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_4
                - conditions: "{{ r3_eff < 1 and not is_state('switch.iotmug_16_relay_board_relay_4', 'on') }}"
                  sequence:
                    - service: homeassistant.turn_on
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_4
              - choose:
                - conditions: "{{ r3_eff >= 2 and not is_state('switch.iotmug_16_relay_board_relay_5', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_5
                - conditions: "{{ r3_eff < 2 and not is_state('switch.iotmug_16_relay_board_relay_5', 'on') }}"
                  sequence:
                    - service: homeassistant.turn_on
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_5

              # --- ZONE 4: Bed 3 (Relay 6) ---
              - choose:
                - conditions: "{{ r4_eff >= 1 and not is_state('switch.iotmug_16_relay_board_relay_6', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_6
                - conditions: "{{ r4_eff < 1 and not is_state('switch.iotmug_16_relay_board_relay_6', 'on') }}"
                  sequence:
                    - service: homeassistant.turn_on
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_6

              # --- ZONE 5: Master Bed (Relays 7, 8) ---
              - choose:
                - conditions: "{{ r5_eff >= 1 and not is_state('switch.iotmug_16_relay_board_relay_7', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_7
                - conditions: "{{ r5_eff < 1 and not is_state('switch.iotmug_16_relay_board_relay_7', 'on') }}"
                  sequence:
                    - service: homeassistant.turn_on
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_7
              - choose:
                - conditions: "{{ r5_eff >= 2 and not is_state('switch.iotmug_16_relay_board_relay_8', 'off') }}"
                  sequence:
                    - service: homeassistant.turn_off
                      target:
                        entity_id: switch.iotmug_16_relay_board_relay_8
                - conditions: "{{ r5_eff < 2 and not is_state('switch.iotmug_16_relay_board_relay_8', 'on') }}"
