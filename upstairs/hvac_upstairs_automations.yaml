              entity_id: input_text.hvac_upstairs_min_airflow_allocation
            data:
              value: "0|0|0|0|0|0"
          # --- FAILSAFE: OPEN ALL ACTIVE DAMPERS; KEEP UNUSED RELAYS CLOSED ---
          - choose:
